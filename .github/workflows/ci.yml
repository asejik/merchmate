name: CI

# Runs every check on each push to main and on pull requests, so a broken change is caught before
# (or right after) it reaches Vercel. The same commands work locally, see the README.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22 # Vite 8 and Vitest 5 need 22.12 or newer
          cache: npm

      - run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit and database tests
        run: npm test

      # Fails only on high or critical advisories in what ships to users
      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Install the test browser
        run: npx playwright install --with-deps chromium

      # Builds the app, serves it with the production headers, and drives it in a real browser
      - name: End-to-end tests
        run: npm run test:e2e

      - name: Keep the browser traces of a failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
